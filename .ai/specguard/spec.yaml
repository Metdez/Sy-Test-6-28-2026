spec_id: "default-spec"
version: "0.1.0"

repo:
  forbidden_globs:
    - "node_modules/**"
    - "dist/**"
    - ".env"
    - "__pycache__/**"
    - "*.pyc"
    - ".venv/**"

deterministic_rules:
  secret_patterns:
    - name: "AWS Access Key"
      regex: "AKIA[0-9A-Z]{16}"
    - name: "Generic Secret"
      regex: "secret\\s*=\\s*['\"][a-zA-Z0-9]{20,}['\"]"
    - name: "Linear API Key"
      regex: "lin_api_[a-zA-Z0-9]{40,}"

tool_verified:
  steps:
    - name: "Type Check"
      command: "python -m mypy src --ignore-missing-imports"
      optional: true
      skip_if_missing: true
    - name: "Lint"
      command: "python -m ruff check src"
      optional: true
      skip_if_missing: true
